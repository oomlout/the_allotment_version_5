- command: prepare_navigate
  url: '{{ base_url }}/en/community'
  seconds: 4
- command: prepare_visual_focus
  text: What is happening?
  region:
  - 0.36
  - 0.17
  - 0.46
  - 0.21
- command: prepare_text
- command: prepare_verify_text
- command: prepare_open
  text: Image
  region:
  - 0.355
  - 0.21
  - 0.385
  - 0.65
  file_picker: true
- command: prepare_upload_image
- command: prepare_preview_zoom
  percent: 200
- command: prepare_finish
  region:

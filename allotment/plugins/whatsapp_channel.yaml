schema_version: 2
engine: oomlout_roboclick_prepare
sending_enabled: false
editable: false
verification: checked_draft_required
max_media: 1
media_types:
- image
id: whatsapp_channel
name: WhatsApp channel
base_url: https://web.whatsapp.com
max_chars: 1024
target_required: true
target_kind: channel
target_label: Channel
target_path_pattern: /?
target_no_query: true
target_hint: Set the exact channel name and public channel URL. The copied channel
  link and owner controls must match.
setup_note: Checks the signed-in account, channel owner controls and exact public
  link. Send stays manual. WhatsApp permits one active web tab; review each draft
  before preparing another.
steps:
- command: prepare_navigate
  label: Open WhatsApp Web
  url: '{{ target_url }}'
  seconds: 4
- command: prepare_open
  label: Open own WhatsApp profile
  template: account.png
  region:
  - 0.005
  - 0.94
  - 0.03
  - 0.99
- command: prepare_visual_identity
  label: Check the signed-in WhatsApp identity
  region:
  - 0.04
  - 0.095
  - 0.25
  - 0.13
- command: prepare_open
  label: Open Channels
  template: channels.png
  region:
  - 0.008
  - 0.22
  - 0.026
  - 0.255
- command: prepare_search_group
  label: Find the configured channel
  text: Search
  region:
  - 0.045
  - 0.14
  - 0.32
  - 0.18
  result_region:
  - 0.07
  - 0.2
  - 0.32
  - 0.4
- command: prepare_visual_target
  label: Check channel owner and exact public address
  region:
  - 0.366
  - 0.09
  - 0.55
  - 0.115
  details: true
  detail_region:
  - 0.76
  - 0.3
  - 0.92
  - 0.34
  kind_text: Channel info
  kind_region:
  - 0.72
  - 0.095
  - 0.85
  - 0.13
  owner_text: Channel settings
  owner_region:
  - 0.74
  - 0.9
  - 0.84
  - 0.94
  copy_link_region:
  - 0.85
  - 0.425
  - 0.89
  - 0.455
- command: prepare_open
  label: Close channel information
  template: close.png
  region:
  - 0.7
  - 0.09
  - 0.725
  - 0.13
- command: prepare_visual_focus
  label: Focus channel update
  text: Type an update
  region:
  - 0.38
  - 0.92
  - 0.8
  - 0.98
- command: prepare_image
  label: Attach sample image
  when: media
- command: prepare_visual_focus
  label: Focus image caption
  text: Type an update
  region:
  - 0.5
  - 0.84
  - 0.81
  - 0.89
  when: media
- command: prepare_text
  label: Paste fixed sample
- command: prepare_verify_text
  label: Check exact caption
- command: prepare_finish
  label: Check image and leave Send manual
  region:
  - 0.34
  - 0.2
  - 0.99
  - 0.85
  reference_region:
  - 0.25
  - 0.25
  - 0.75
  - 0.75
preparation_ready: true
badge: W

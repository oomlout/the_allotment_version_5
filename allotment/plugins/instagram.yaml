id: instagram
name: Instagram
badge: I
base_url: https://www.instagram.com
max_chars: 2200
schema_version: 2
engine: oomlout_roboclick_prepare
sending_enabled: false
editable: false
preparation_ready: true
verification: checked_draft_required
max_media: 1
media_types:
- image
setup_note: Prepares the full image and caption. Share stays manual.
steps:
- command: prepare_navigate
  url: '{{ profile_url }}'
  seconds: 4
- command: prepare_visual_identity
  # Navigation already checks the exact URL; verify the account and owner here.
  region:
  - 0.39
  - 0.13
  - 0.55
  - 0.20
  owner_text: Edit Profile
  owner_region:
  - 0.30
  - 0.28
  - 0.55
  - 0.36
- command: prepare_open
  # Sidebar Post opens a new composer; it is not the final Share control.
  # Match the icon alone across the sidebar so labels/spacing can change.
  template: create.png
  region:
  - 0.005
  - 0.17
  - 0.125
  - 0.88
  seconds: 1
- command: prepare_open
  text: Select From Computer
  region:
  - 0.35
  - 0.50
  - 0.65
  - 0.73
  file_picker: true
- command: prepare_upload_image
- command: prepare_open
  template: crop.png
  region:
  - 0.27
  - 0.78
  - 0.36
  - 0.94
- command: prepare_open
  text: Original
  # Keep this low-contrast label isolated from the adjacent icon and photo;
  # keep the crop below the menu's rounded top edge, also over portrait images.
  region:
  - 0.312
  - 0.675
  - 0.345
  - 0.705
- command: prepare_open
  text: Next
  # Keep OCR inside the white header; crossing its edge hides the small label.
  region:
  - 0.64
  - 0.17
  - 0.685
  - 0.20
  seconds: 1
- command: prepare_open
  text: Next
  region:
  - 0.73
  - 0.17
  - 0.775
  - 0.20
  seconds: 1
- command: prepare_visual_focus
  text: Add a caption...
  region:
  - 0.605
  - 0.25
  - 0.765
  - 0.32
- command: prepare_text
- command: prepare_verify_text
- command: prepare_finish
  region:
  - 0.2
  - 0.2
  - 0.62
  - 0.92
  reference_region:
  - 0.25
  - 0.25
  - 0.75
  - 0.75
min_media: 1

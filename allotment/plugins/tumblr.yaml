id: tumblr
name: Tumblr
badge: t
base_url: https://www.tumblr.com
max_chars: 10000
schema_version: 2
engine: oomlout_roboclick_prepare
sending_enabled: false
editable: false
preparation_ready: true
verification: checked_draft_required
max_media: 1
media_types:
- image
setup_note: Chooses Photo for image input and Text for text-only input. Post now stays
  manual. Video is not yet supported.
steps:
- command: prepare_navigate
  url: '{{ base_url }}/blog/{{ handle }}'
  seconds: 4
- command: prepare_visual_identity
  # Navigation already checks the exact URL; verify the account and owner here.
  region:
  - 0.62
  - 0.23
  - 0.73
  - 0.31
  owner_text: Blog settings
  owner_region:
  - 0.62
  - 0.53
  - 0.75
  - 0.70
- command: prepare_navigate
  when: media
  url: '{{ base_url }}/new/photo?name={{ handle }}'
  seconds: 4
- command: prepare_navigate
  when: no_media
  url: '{{ base_url }}/new/text?name={{ handle }}'
  seconds: 4
- command: prepare_visual_identity
  # Confirm the selected blog after navigation (accounts can own several blogs).
  region:
  - 0.38
  - 0.23
  - 0.55
  - 0.40
- command: prepare_open
  when: media
  template: attach.png
  region:
  - 0.36
  - 0.36
  - 0.49
  - 0.55
  file_picker: true
- command: prepare_upload_image
  when: media
- command: prepare_visual_focus
  text: Go ahead, put anything.
  # The light placeholder is unreliable in OCR beside the uploaded image.
  template: editor.png
  region:
  - 0.36
  - 0.40
  - 0.60
  # Portrait images push the caption below the square/landscape test position.
  - 0.95
- command: prepare_text
- command: prepare_verify_text
  select_all: 2
- command: prepare_finish
  # Exact caption copy-back, image preview and URL are the completion checks.
  # Do not require a pixel-identical Post now button or interact with it.
  region:
  - 0.35
  - 0.15
  - 0.65
  - 0.96
  reference_region:
  - 0.25
  - 0.25
  - 0.75
  - 0.75

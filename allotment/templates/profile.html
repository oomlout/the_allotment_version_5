{% extends 'base.html' %}
{% block content %}<div class="page-heading"><h1>Profile</h1></div>
<form method="post" enctype="multipart/form-data" class="panel settings-form"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="form-grid"><label>Display name<input name="display_name" value="{{ profile.display_name }}" required></label><label>Account<input value="{{ namespace }}/{{ user }}" readonly></label></div><label>Bio<textarea name="bio" rows="3">{{ profile.bio }}</textarea></label><label>Website<input type="url" name="website" value="{{ profile.website }}" placeholder="https://"></label><div class="form-grid"><label>Profile image{% if profile.avatar %}<img class="asset-preview avatar-preview" src="{{ url_for('garden_media',namespace=namespace,user=user,filename=profile.avatar) }}" alt="Current avatar">{% endif %}<input type="file" name="avatar" accept="image/jpeg,image/png,image/gif,image/webp"></label><label>Banner{% if profile.banner %}<img class="asset-preview" src="{{ url_for('garden_media',namespace=namespace,user=user,filename=profile.banner) }}" alt="Current banner">{% endif %}<input type="file" name="banner" accept="image/jpeg,image/png,image/gif,image/webp"></label></div><div class="form-actions"><button class="button primary">Save profile</button></div></form>{% endblock %}

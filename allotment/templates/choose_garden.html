{% extends 'base.html' %}{% block content %}<div class="page-heading"><h1>Choose garden</h1></div><div class="garden-cards">{% for g in profiles %}<form method="post" class="panel garden-card"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="garden" value="{{ g.namespace }}/{{ g.user }}"><div class="garden-card-mark">{{ g.display_name[:1]|upper }}</div><h2>{{ g.display_name }}</h2><p>{{ g.namespace }} / <strong>{{ g.user }}</strong></p><button class="button primary">Open {{ g.user }}</button></form>{% else %}<p>No gardens found under garden/.</p>{% endfor %}</div>{% endblock %}

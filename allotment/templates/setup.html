{% extends 'base.html' %}
{% block content %}<div class="page-heading"><h1>Add account</h1></div><form method="post" class="panel settings-form narrow"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="form-grid"><label>Namespace<input name="namespace" value="the_allotment" pattern="[a-z0-9][a-z0-9_-]{0,79}" required></label><label>User ID<input name="user" pattern="[a-z0-9][a-z0-9_-]{0,79}" required></label></div><label>Display name<input name="display_name"></label><fieldset><legend>Repository</legend><label class="check-label"><input type="radio" name="mode" value="new" checked> Create local repository</label><label class="check-label"><input type="radio" name="mode" value="clone"> Clone repository</label></fieldset><label>Remote URL<input name="remote" placeholder="https://github.com/owner/repository.git"></label><button class="button primary">Add account</button></form>{% endblock %}

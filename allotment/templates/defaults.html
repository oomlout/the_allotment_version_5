{% extends 'base.html' %}{% block content %}<div class="page-heading"><h1>Sowing defaults</h1></div><form class="panel" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="defaults-grid">{% for key,value in framing.items() %}<label>{{ names.get(key,key) }}<select name="frame_{{ key }}">{% for id,label in choices.items() %}<option value="{{ id }}" {% if value==id %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>{% endfor %}</div><button class="button primary">Save defaults</button></form><details class="panel"><summary>Account and exports</summary><a class="button secondary" href="{{ url_for('profile_settings',namespace=namespace,user=user) }}">Profile</a> <a class="button secondary" href="{{ url_for('website',namespace=namespace,user=user) }}">Static website</a></details>{% endblock %}

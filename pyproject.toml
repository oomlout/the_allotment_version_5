[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-allotment"
version = "0.1.0"
description = "Folder-first publishing, a local studio, and portable browser workers"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "PyYAML>=6,<7", "tzdata>=2024.1", "psutil>=6,<8", "PyAutoGUI>=0.9.54,<1", "pyperclip>=1.9,<2", "Pillow>=11,<13", "pytesseract>=0.3.13,<1", "opencv-python-headless>=4.10,<5", "beautifulsoup4>=4.12,<5", "pywin32>=308; sys_platform == \"win32\""]

[project.optional-dependencies]
test = ["pytest>=8,<10", "playwright>=1.60,<2"]

[tool.setuptools.package-data]
allotment = ["templates/*.html", "static/*", "static/vendor/cropper/*", "plugins/*.yaml", "guides/*.md", "presets/*.yaml", "roboclick/*.md", "roboclick/actions/*/working.py", "preparation_actions/*/working.py"]

[tool.setuptools.packages.find]
include = ["allotment*"]
exclude = ["allotment_static*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
